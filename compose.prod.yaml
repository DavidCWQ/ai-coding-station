name: ai-coding-station

services:
  mysql:
    image: mysql:9.5.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_coding_station_memo
      MYSQL_USER: ${MYSQL_USERNAME:-ai_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout:  5s
      retries:  30
      start_period: 20s

  redis:
    image: redis:8.4.0
    container_name: redis-cache
    restart: unless-stopped
    environment:
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret} # database: 0 by default
    ports:
      - "6380:6379"
    # NOTES: --requirepass will SET username AS `default`!
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --appendonly  yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-redis_secret}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 可选：仅当后端启用 ai.rag.enabled=true 时需要；不需要 RAG 时可从本文件中移除此服务以节省资源
  postgres-rag:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    container_name: postgres-rag
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_coding_vector_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_RAG_PASSWORD:-rag_secret}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgvector_rag_data:/var/lib/postgresql/data
      - ./sql/rag:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_coding_vector_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  nginx:
    image: nginx:stable-alpine3.23-perl
    container_name: nginx-proxy
    depends_on:
      frontend:
        condition: service_completed_successfully
    ports:
      - "8088:80"
    volumes:
      - ./tmp/code_deploy:/usr/share/nginx/html
      - ./tmp/covers:/usr/share/nginx/static/covers
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-coding-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nginx:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    environment: # 注意：环境变量必须传进 backend 容器的 environment，否则无法生效！
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_USERNAME: ${MYSQL_USERNAME:-ai_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_secret}
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      APP_USER_REGISTRATION_ENABLED: ${APP_USER_REGISTRATION_ENABLED:-false}
      PUBLIC_DEPLOY_HOST: ${PUBLIC_DEPLOY_HOST:-http://your-domain.com:port}
      PUBLIC_COVERS_BASE: ${PUBLIC_COVERS_BASE:-http://your-domain.com:port}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 仅当 ai.rag.enabled=true 时需要：DashScope 嵌入与 RAG 库密码
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      POSTGRES_RAG_PASSWORD: ${POSTGRES_RAG_PASSWORD:-rag_secret}
    ports:
      - "8142:8142"
    volumes:
      - ./tmp/code_output:/app/tmp/code_output
      - ./tmp/code_deploy:/app/tmp/code_deploy
      - ./tmp/covers:/app/tmp/covers

  # 前端构建服务：只负责将 ai-coding-station-frontend 构建产物复制到 tmp/code_deploy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    command: ["sh", "-c", "cp -r /frontend/dist/* /shared-dist && echo 'frontend build done'"]
    volumes:
      - ./tmp/code_deploy:/shared-dist
    restart: "no"

volumes:
  mysql_data:
  redis_data:
  pgvector_rag_data:
