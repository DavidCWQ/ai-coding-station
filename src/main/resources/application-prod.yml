# 通过 SPRING_PROFILES_ACTIVE=prod 启用（见 compose.prod.yaml 中 backend 服务）

langchain4j:
  # Docker 环境下从环境变量中读取 DeepSeek API Key
  open-ai:
    chat-model:
      api-key: ${DEEPSEEK_API_KEY:}
    streaming-chat-model:
      api-key: ${DEEPSEEK_API_KEY:}

# 若启用智能体 RAG (ai.rag.enabled=true)，请在 compose 中部署 postgres-rag，并保证下列 JDBC 可达
# 可选：ai.rag.cleanup-deleted 默认为 false（不主动清理已删除文档的历史向量）
ai:
  rag:
    enabled: true

rag:
  datasource:
    url: jdbc:postgresql://postgres-rag:5432/ai_coding_vector_db
    jdbc-url: jdbc:postgresql://postgres-rag:5432/ai_coding_vector_db
    username: postgres
    password: ${POSTGRES_RAG_PASSWORD:rag_secret}
    driver-class-name: org.postgresql.Driver

spring:
  # 容器内不再由 Spring 去管理 docker compose
  docker:
    compose:
      enabled: false

  # 覆盖为容器网络内的 MySQL / Redis 地址
  datasource:
    # allowPublicKeyRetrieval：MySQL 8+ caching_sha2_password 在部分 JDBC 连接场景需要，否则报 Public Key Retrieval is not allowed
    url: jdbc:mysql://mysql:3306/ai_coding_station_memo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:ai_user}
    password: ${MYSQL_PASSWORD:ai_secret}

  data:
    redis:
      host: redis
      # 容器网络内访问 Redis 使用容器端口 6379（6380 仅宿主机映射端口）
      port: 6379
      username: default
      password: ${REDIS_PASSWORD:redis_secret}

app:
  user:
    # 生产环境默认关闭新用户注册（可用环境变量覆盖）
    registration-enabled: ${APP_USER_REGISTRATION_ENABLED:false}
  deploy:
    # 容器内 Playwright / 服务端访问静态站
    deploy-host: http://nginx
    # 浏览器与前端可访问的部署页基址（按实际域名或宿主机 IP 修改）
    public-deploy-host: ${PUBLIC_DEPLOY_HOST:}
  screenshot:
    # 路径和输出目录与 application.yml 相同，无需重复覆盖
    base-url: ${PUBLIC_COVERS_BASE:}/covers

knife4j:
  basic:
    username: ${KNIFE_USERNAME:}
    password: ${KNIFE_PASSWORD:}
