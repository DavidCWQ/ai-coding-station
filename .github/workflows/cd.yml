name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    if: >
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    steps:
      - name: Trigger remote deploy script via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            export PROJECT_DIR="${{ secrets.SERVER_PROJECT_DIR }}"
            if [ -z "$PROJECT_DIR" ]; then
              echo "SERVER_PROJECT_DIR is required."
              exit 1
            fi
            if [ ! -f "$PROJECT_DIR/scripts/deploy-prod.sh" ]; then
              echo "Missing deploy script: $PROJECT_DIR/scripts/deploy-prod.sh"
              exit 1
            fi
            cd "$PROJECT_DIR"
            chmod +x scripts/deploy-prod.sh
            ./scripts/deploy-prod.sh
