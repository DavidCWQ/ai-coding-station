name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Unit and Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Ensure Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Maven verify with coverage gate (CI-safe tests)
        run: >
          ./mvnw -B verify
          -Dtest='*Test,*Tests,!AICodeGeneratorServiceTest,!AICodeGeneratorFacadeTest,!WebScreenshotServiceTest'

      - name: Run excluded tests separately (non-blocking)
        if: ${{ always() }}
        run: >
          ./mvnw -B test
          -Dtest='AICodeGeneratorServiceTest,AICodeGeneratorFacadeTest,WebScreenshotServiceTest'
        continue-on-error: true

  frontend-tests:
    name: Frontend Typecheck Build and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-coding-station-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: ai-coding-station-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test

      - name: Run production build
        run: npm run build-only
