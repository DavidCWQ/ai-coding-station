events {}

http {
    # 加载默认 MIME 类型，避免 JS 被当成 text/plain 导致模块脚本加载失败
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 静态资源服务器 - 80 端口（本地环境）
    server {
        listen 80;                  # 监听HTTP默认端口
        server_name localhost;      # 服务器域名

        charset         utf-8;
        charset_types   text/css application/javascript text/plain text/xml application/json;

        # 本地静态资源目录（由 compose.yaml 中挂载 ./tmp/code_deploy）
        root /usr/share/nginx/html; # 项目部署根目录
        index index.html;           # 默认首页文件

        # 单页面应用路由配置，最后才返回 404
        location / {
            try_files $uri $uri/ /index.html =404;
        }

        # 封面图静态目录
        location /covers/ {
            alias /usr/share/nginx/static/covers/;
            # CORS（跨域）
            add_header Access-Control-Allow-Origin * always;
            # 缓存策略
            add_header Cache-Control "public";
        }
    }
}

