events {}

http {
    # 加载默认 MIME 类型，避免 JS 被当成 text/plain 导致模块脚本加载失败
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 生产环境 HTTP 入口：统一跳转到 HTTPS
    server {
        listen 80;
        server_name davidcwq.online www.davidcwq.online;
        return 301 https://$host$request_uri;
    }

    # 生产环境 HTTPS 服务器
    server {
        listen 443 ssl;
        server_name davidcwq.online www.davidcwq.online _;

        ssl_certificate /etc/nginx/ssl/davidcwq.online_bundle.crt;
        ssl_certificate_key /etc/nginx/ssl/davidcwq.online.key;

        charset         utf-8;
        charset_types   text/css application/javascript text/plain text/xml application/json;

        # 前端构建产物（由 frontend 服务写入 /usr/share/nginx/html）
        root /usr/share/nginx/html; # 项目部署根目录
        index index.html;           # 默认首页文件

        # 单页面应用路由配置，最后才返回 404
        location / {
            try_files $uri $uri/ /index.html =404;
        }

        # 仅对所有 index.html 禁用强缓存（包括 / 和 /EvREh3/index.html 等）
        location ~* /index\.html$ {
            try_files $uri =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # 仅对 JS 资源禁用强缓存，确保脚本始终为最新版本
        location ~* \.js$ {
            try_files $uri =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # 封面图静态目录
        location /covers/ {
            alias /usr/share/nginx/static/covers/;
            # CORS（跨域）
            add_header Access-Control-Allow-Origin * always;
            # 缓存策略
            add_header Cache-Control "public";
        }

        # 后端 API 反向代理到 Spring Boot 容器
        location /api/ {
            proxy_pass http://backend:8142/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }
}

