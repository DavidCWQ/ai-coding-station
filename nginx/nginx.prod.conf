events {}

http {
    # 静态资源服务器 - 80 端口（生产环境）
    server {
        listen 80;                  # 监听HTTP默认端口
        server_name localhost;      # 服务器域名

        charset         utf-8;
        charset_types   text/css application/javascript text/plain text/xml application/json;

        # 前端构建产物（由 frontend 服务写入 /usr/share/nginx/html）
        root /usr/share/nginx/html; # 项目部署根目录
        index index.html;           # 默认首页文件

        # 单页面应用路由配置，最后才返回 404
        location / {
            try_files $uri $uri/ /index.html =404;
        }

        # 封面图静态目录
        location /covers/ {
            alias /usr/share/nginx/static/covers/;
            # CORS（跨域）
            add_header Access-Control-Allow-Origin * always;
            # 缓存策略
            add_header Cache-Control "public";
        }

        # 后端 API 反向代理到 Spring Boot 容器
        location /api/ {
            proxy_pass http://backend:8142/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

