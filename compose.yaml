name: ai-coding-station

services:
  mysql:
    image: mysql:latest
    container_name: mysql-memo
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_coding_station_memo
      MYSQL_USER: ai_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:latest
    container_name: redis-memo
    restart: unless-stopped
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret} # database: 0 by default
    ports:
      - "6380:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --appendonly  yes
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:stable-alpine3.23-perl
    container_name: ai-nginx
    ports:
      - "8088:80"
    volumes:
      - ./tmp/code_deploy:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    restart: always

volumes:
  mysql_data:
  redis_data:
