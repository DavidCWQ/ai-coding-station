name: ai-coding-station

services:
  mysql:
    image: mysql:9.5.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_coding_station_memo
      MYSQL_USER: ${MYSQL_USERNAME:-ai_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:8.4.0
    container_name: redis-cache
    restart: unless-stopped
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret} # database: 0 by default
    ports:
      - "6380:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --appendonly  yes
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:stable-alpine3.23-perl
    container_name: nginx-proxy
    ports:
      - "8088:80"
    volumes:
      - ./tmp/code_deploy:/usr/share/nginx/html
      - ./tmp/covers:/usr/share/nginx/static/covers
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
    restart: always

  # 可选：智能体 RAG (pgvector)。仅当 ai.rag.enabled=true 时需要；不需要时可删除本服务
  postgres-rag:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    container_name: postgres-rag
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_coding_vector_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_RAG_PASSWORD:-rag_secret}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgvector_rag_data:/var/lib/postgresql
      - ./sql/rag:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
  redis_data:
  pgvector_rag_data:
